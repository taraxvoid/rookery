name: Sync labels

# main only, never on pull_request: labels are shared repo state that an
# unmerged PR shouldn't be able to change.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - sync_labels.py
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply .github/labels.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 sync_labels.py
