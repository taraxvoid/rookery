name: Sync labels

# main only, never on pull_request: labels are shared repo state that an
# unmerged PR shouldn't be able to change. Calls the reusable workflow in this
# repo, the same one other repos call pinned by SHA.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels-reusable.yml
      - sync_labels.py
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync-labels-reusable.yml
